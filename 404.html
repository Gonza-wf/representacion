<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página no encontrada | Showcase Labs</title>
  <meta name="description" content="La página que estás buscando no existe o fue movida. Regresá al laboratorio de componentes interactivos." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --border: #e2e8f0;
      --glow: rgba(37, 99, 235, 0.15);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --surface: #111827;
        --text: #f8fafc;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --border: rgba(255, 255, 255, 0.1);
        --glow: rgba(59, 130, 246, 0.3);
      }
    }
    body.dark {
      --bg: #090d16;
      --surface: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --border: rgba(255, 255, 255, 0.1);
      --glow: rgba(59, 130, 246, 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem 2rem;
      box-shadow: 0 20px 45px -10px var(--glow);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }
    .code-404 {
      font-size: clamp(4.5rem, 12vw, 6.5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--primary);
      color: #ffffff;
      padding: 0.85rem 1.75rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.45);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span>ERROR DE ENLACE</span>
    </div>
    <div class="code-404">404</div>
    <h1>Página no encontrada</h1>
    <p>El componente o recurso al que intentás acceder no existe, ha cambiado de ruta o se encuentra en mantenimiento.</p>
    <a href="/" class="btn-home">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Volver al Laboratorio</span>
    </a>
  </div>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
    }
  </script>
</body>
</html>
