<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Layer 1 (bottom) -->
  <path d="M32 46 L14 36 L32 26 L50 36 Z" fill="url(#grad1)" opacity="0.4" />
  <path d="M14 36 L32 46 L50 36 L50 40 L32 50 L14 40 Z" fill="url(#grad1)" opacity="0.7" />

  <!-- Layer 2 (middle) -->
  <path d="M32 36 L14 26 L32 16 L50 26 Z" fill="url(#grad1)" opacity="0.6" />
  <path d="M14 26 L32 36 L50 26 L50 30 L32 40 L14 30 Z" fill="url(#grad1)" opacity="0.9" />

  <!-- Layer 3 (top) -->
  <path d="M32 26 L14 16 L32 6 L50 16 Z" fill="url(#grad2)" filter="url(#glow)" />
  <path d="M14 16 L32 26 L50 16 L50 20 L32 30 L14 20 Z" fill="url(#grad1)" />

  <!-- Vibrant Accent Dot -->
  <circle cx="51" cy="13" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="51" cy="13" r="2.5" fill="#ffffff" />
</svg>
